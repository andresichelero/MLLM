[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mellm"
version = "0.1.0"
description = "MeLLM: Unified LLM and Autonomous Agent Observability, Forensics & Honeynet Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MeLLM Team", email = "dev@mellm.local" }
]
dependencies = [
    "duckdb>=1.0.0",
    "networkx>=3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
mellm = "mellm.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
